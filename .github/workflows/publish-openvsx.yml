# 发布新版本到两个扩展市场：
#   - Open VSX（open-vsx.org）：Cursor / VSCodium 等使用的扩展索引
#   - Visual Studio Marketplace：官方 VS Code 使用的市场
#
# 所需 Secrets（仓库 Settings → Secrets → Actions）：
#   OVSX_PAT  Open VSX 个人访问令牌
#   VSCE_PAT  Azure DevOps PAT，需含 Marketplace: Acquire + Manage 权限
# 缺少某个令牌时只跳过对应的发布步骤并给出警告，不会让整个流程失败。

name: Publish Extension

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      # secrets 上下文在 step 的 if 条件中不可用，先转成 output 供后续判断
      - name: Check available tokens
        id: tokens
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            echo "ovsx=true" >> "$GITHUB_OUTPUT"
          else
            echo "ovsx=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 OVSX_PAT，将跳过 Open VSX 发布"
          fi
          if [ -n "$VSCE_PAT" ]; then
            echo "vsce=true" >> "$GITHUB_OUTPUT"
          else
            echo "vsce=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 VSCE_PAT，将跳过 Visual Studio Marketplace 发布"
          fi

      - name: Publish to Open VSX
        if: steps.tokens.outputs.ovsx == 'true'
        run: npx --yes ovsx publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Publish to Visual Studio Marketplace
        if: steps.tokens.outputs.vsce == 'true'
        run: npx --yes @vscode/vsce publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
